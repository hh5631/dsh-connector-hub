<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>连接器</title>
<link rel="stylesheet" href="hub.css" />
</head>
<body>
<div class="shell">
  <main class="main">
    <header class="topbar">
      <h1 id="view-title">连接器</h1>
      <span class="crumb" id="section-label">外部服务接入</span>
      <span class="spacer"></span>
      <div class="search">
        <span class="icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" autocomplete="off" placeholder="搜索连接器…">
      </div>
      <button class="tbtn" type="button" id="btn-refresh">刷新</button>
      <button class="tbtn strong" type="button" id="btn-add">添加连接</button>
      <button class="tbtn connected-btn" type="button" id="btn-connected" aria-expanded="false" aria-controls="drawer">
        <span id="connected-label">已连接</span>
        <span class="count" id="connected-count"></span>
      </button>
    </header>

    <div class="content" id="content">
      <div class="groupbar" id="groupbar" hidden></div>

      <div class="section-head">
        <h3 id="list-title">目录</h3>
        <span class="count" id="list-count"></span>
        <span class="spacer"></span>
        <div class="layout-switch" id="layout-switch" role="group" aria-label="视图">
          <button type="button" data-layout="list" aria-pressed="true" title="列表视图">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M3 5h14v2H3V5zm0 4h14v2H3V9zm0 4h14v2H3v-2z"/></svg>
          </button>
          <button type="button" data-layout="grid" aria-pressed="false" title="栅格视图">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M3 3h6v6H3V3zm8 0h6v6h-6V3zM3 11h6v6H3v-6zm8 0h6v6h-6v-6z"/></svg>
          </button>
        </div>
      </div>
      <div class="loading" id="loading" hidden>正在读取…</div>
      <div id="rows"></div>
      <div class="pager" id="pager" hidden></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title">已连接</h2>
    <button class="tbtn" type="button" id="drawer-close">关闭</button>
  </div>
  <div class="drawer-stats" id="drawer-stats"></div>
  <div class="drawer-body" id="drawer-rows"></div>
</aside>

<div class="mask" id="mask" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="icons.js"></script>
<script src="hub.js"></script>
</body>
</html>
